schema: neta.generation.model.v1
model: kling-omni-video
title: Kling Omni Video
description: Kling Omni-Video generation model.
adapter:
  type: kling.videoGenerations
content:
  input:
    - type: text
      required: false
      max: 16
      merge: newline
      description: Optional video prompt. Use Kling Omni placeholders such as <<<image_1>>> with image_list.
    - type: image
      required: false
      max: 2
      sources:
        - url
      description: Optional simple image input. Provider-native Omni media arrays belong in request meta.
parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 5
    max: 15
    description: Video duration in seconds.
  aspect_ratio:
    type: string
    optional: true
    default: 16:9
    enum:
      - 16:9
      - 9:16
      - 1:1
    description: Output aspect ratio.
  mode:
    type: string
    optional: true
    default: std
    enum:
      - std
      - pro
    description: Kling generation mode.
  cfg_scale:
    type: number
    optional: true
    default: 0.5
    min: 0
    max: 1
    description: Prompt adherence scale.
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 30
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 900
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.
  sound:
    type: string
    optional: true
    enum:
      - on
      - off
    description: Enable or disable generated sound when supported.
meta:
  fields:
    multi_shot:
      type: boolean
      optional: true
      description: Enable Kling Omni multi-shot mode.
    shot_type:
      type: string
      optional: true
      description: Kling Omni shot type.
examples:
  - title: Omni text to video
    request:
      model: kling-omni-video
      content:
        - type: text
          text: a small paper boat floating on calm water, cinematic motion
      parameters:
        duration: 5
        aspect_ratio: 16:9
        mode: std
  - title: Omni image to video
    request:
      model: kling-omni-video
      content:
        - type: text
          text: <<<image_1>>> gently turns toward the camera with soft natural motion
      parameters:
        duration: 5
        aspect_ratio: 16:9
      meta:
        image_list:
          - image_url: https://example.com/input.png
            type: first_frame
