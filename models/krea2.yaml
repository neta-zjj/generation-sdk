schema: neta.generation.model.v1
model: krea2
title: Krea 2
description: Designed for visually refined image generation with broad aesthetic diversity. Strong natural-language understanding helps it follow detailed prompts. Text-only input; reference images are not supported. Relatively fast and low cost.
adapter:
  type: openai.images
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Prompt text.
parameters:
  size:
    type: string
    optional: true
    default: 1024x1024
    description: Output image size.
    examples:
      - auto
      - 1024x1024
      - 1536x1024
      - 1024x1536
      - 2048x2048
      - 2048x1152
      - 3840x2160
      - 2160x3840
  quality:
    type: string
    optional: true
    default: auto
    enum:
      - auto
      - low
      - medium
      - high
    description: Image quality.
examples:
  - title: Text-to-image
    request:
      model: krea2
      content:
        - type: text
          text: an elegant editorial portrait with sculptural lighting
      parameters:
        size: 1024x1024
        quality: auto
