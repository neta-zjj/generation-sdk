schema: neta.generation.model.v1
model: suno_lyrics
title: Suno Lyrics
description: Suno lyrics generation model.
adapter:
  type: suno.tasks
  operation: lyrics
content:
  input:
    - type: text
      required: true
      max: 16
      merge: newline
      description: Prompt text. The adapter maps merged text to the operation's text field when that field is not provided.
parameters:
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 600
    min: 30
    max: 3600
    description: Maximum seconds to wait for task completion.
