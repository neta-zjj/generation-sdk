schema: neta.generation.model.v1
model: kling-multi-image-to-video
title: Kling Multi-Image Reference To Video
description: Kling multi-image reference video generation model.
adapter:
  type: kling.videoGenerations
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.
    - type: image
      required: false
      max: 4
      sources:
        - url
      description: Reference image inputs. Provider-native image_list input may be passed in meta.
parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 5
    max: 10
    description: Video duration in seconds.
  aspect_ratio:
    type: string
    optional: true
    default: 16:9
    enum:
      - 16:9
      - 9:16
      - 1:1
    description: Output aspect ratio.
  mode:
    type: string
    optional: true
    default: std
    enum:
      - std
      - pro
    description: Kling generation mode.
  cfg_scale:
    type: number
    optional: true
    default: 0.5
    min: 0
    max: 1
    description: Prompt adherence scale.
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 30
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 900
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.
  negative_prompt:
    type: string
    optional: true
    description: Negative prompt.
  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.
examples:
  - title: Multi-image reference to video
    request:
      model: kling-multi-image-to-video
      content:
        - type: text
          text: combine the references into one cinematic shot
        - type: image
          source:
            type: url
            url: https://example.com/reference-1.png
        - type: image
          source:
            type: url
            url: https://example.com/reference-2.png
      parameters:
        duration: 5
        aspect_ratio: 16:9
