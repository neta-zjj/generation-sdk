schema: neta.generation.model.v1
model: noobxl-i2i-ipa-onediff
title: NoobXL I2I IPA OneDiff
description: Anime-specialized NoobXL image-to-image model that redraws a single uploaded image using it as a style or character reference. It works best with English Danbooru tags, which can invoke specific anime characters and illustrator styles. Natural-language understanding is limited. Fast and extremely low cost.
allowUnknownParameters: true
adapter:
  type: openai.images
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Prompt text.
    - type: image
      required: true
      min: 1
      max: 1
      sources:
        - url
      description: Single source image.
parameters:
  size:
    type: string
    optional: true
    default: 1024x1024
    enum:
      - 1024x1024
      - 896x1152
      - 1152x896
      - 1344x768
      - 768x1344
    description: Output image size.
  negative_prompt:
    type: string
    optional: true
    description: Content to avoid in generated images.
  seed:
    type: integer
    optional: true
    min: 0
    description: Random seed for reproducibility.
  controlnet_weight:
    type: number
    optional: true
    min: 0
    max: 2
    description: ControlNet tile weight. The provider default is 0.8.
  ipadapter_face_image_ref:
    type: string
    optional: true
    description: Optional face reference image URL for IP-Adapter.
  ipadapter_face_weight:
    type: number
    optional: true
    min: 0
    max: 2
    description: IP-Adapter face weight. The provider default is 0.6 when a face reference is supplied.
examples:
  - title: Image to image
    request:
      model: noobxl-i2i-ipa-onediff
      content:
        - type: text
          text: keep the character identity, redraw as a polished anime illustration
        - type: image
          source:
            type: url
            url: https://example.com/reference.png
      parameters:
        size: 1024x1024
        controlnet_weight: 0.8
