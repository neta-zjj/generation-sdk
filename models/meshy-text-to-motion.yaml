schema: neta.generation.model.v1
model: meshy-text-to-motion
title: Meshy Text To Motion
category: 3d
description: Generates a motion clip from a text description. Apply it to a rigged character with meshy-animation.
adapter:
  type: meshy.tasks
  operation: text_to_motion
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Description of the motion, up to 400 characters.
parameters:
  duration:
    type: number
    min: 2
    max: 10
    multipleOf: 0.5
    description: Clip duration in seconds, from 2 to 10 in steps of 0.5.
  mode:
    type: string
    optional: true
    enum:
      - prime
      - swift
    description: prime gives the highest quality and outputs FBX; swift is faster, costs less, and outputs BVH.
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 3600
    min: 60
    max: 7200
    description: Maximum seconds to wait for the task. Meshy recommends waiting at least 60 minutes.
examples:
  - title: Text to motion
    request:
      model: meshy-text-to-motion
      content:
        - type: text
          text: a person jumps forward and lands softly
      parameters:
        duration: 3
        mode: prime
