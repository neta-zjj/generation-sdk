schema: neta.generation.model.v1
model: birefnet-general
title: BiRefNet General
description: Single-image background removal model that produces images with transparent backgrounds. Well suited to image post-processing and creating web assets. Fast and extremely low cost.
adapter:
  type: openai.images
content:
  input:
    - type: image
      required: true
      min: 1
      max: 1
      sources:
        - url
      description: Single source image.
examples:
  - title: Remove background
    request:
      model: birefnet-general
      content:
        - type: image
          source:
            type: url
            url: https://example.com/portrait.png
