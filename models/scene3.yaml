schema: neta.generation.model.v1
model: scene3
title: Scene 3
category: audio
description: 'Expressive speech in about 80 languages, in a built-in voice or a voice cloned from reference recordings; in a dialogue each speaker gets a reference. Direct the delivery in the text itself (see the text input). Up to about 14 minutes of speech per request. Not supported: speed, response_format, voice, voice_prompt, stream, or a language parameter. Dependency: clone prior generated audio.'
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: 'Text to speak. Square-bracket cues act where placed, e.g. [sighs], [whispering], [excited]; <|speaker:N|> (0-15) starts speaker N''s turn; text in ( ) is spoken. Longer references lower the length limit; text over it gets a 400 naming the limit, so split it.'
    - type: audio
      required: false
      max: 16
      sources:
        - url
      description: 'Clone: up to 16 reference URLs, best at 1-20 s each. With <|speaker:N|>, recording N (from 0) voices speaker N; otherwise they form one voice. meta.text: optional transcript. Dependency: use prior generated audio.'
parameters:
  drama_value:
    type: number
    optional: true
    default: 0.5
    min: 0
    max: 1
    description: '0 to 1, default 0.5. Higher gives more varied intonation, lower a steadier read; the effect is subtle, so use text cues for a clear change. Lean higher (e.g. 0.7-0.8) for dialogue and emotional scenes, lower (e.g. 0.3) for calm narration.'
  seed:
    type: integer
    optional: true
    min: 0
    max: 9007199254740991
    description: Random seed for reproducibility.
examples:
  - title: Built-in voice with directions
    request:
      model: scene3
      content:
        - type: text
          text: '[sighs] We missed the last train again. [laughs] Well, at least the night is warm.'
  - title: Reference clone
    request:
      model: scene3
      content:
        - type: text
          text: 今天风有点大，出门记得多穿一件外套。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
  - title: Reference clone with its transcript
    request:
      model: scene3
      content:
        - type: text
          text: 我们明天早上八点在车站见，别迟到。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
          meta:
            text: 大家好，欢迎收听今天的节目。
  - title: Two speakers, livelier delivery
    request:
      model: scene3
      content:
        - type: text
          text: '<|speaker:0|>[gasps] You came back! <|speaker:1|>[laughs] I said I would.'
        - type: audio
          source:
            type: url
            url: https://example.com/speaker-0.mp3
        - type: audio
          source:
            type: url
            url: https://example.com/speaker-1.mp3
      parameters:
        drama_value: 0.8
