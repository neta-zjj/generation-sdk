schema: neta.generation.model.v1
model: gemini-3.1-flash-lite-image
title: Gemini 3.1 Flash Lite Image
category: image
description: Excels at text rendering, UI components and icons, commercial visuals, and image editing. It supports both photorealistic and non-photorealistic styles, producing clean, consistent results while preserving key features from references. Strong natural-language understanding and broad world knowledge help it follow complex prompts. This Lite variant produces fixed 1K output and is optimized for fast generation at a moderate price.
adapter:
  type: gemini.generateContent
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Prompt text.
    - type: image
      required: false
      max: 14
      sources:
        - url
      description: Optional reference images.
parameters:
  aspect_ratio:
    type: string
    optional: true
    default: "1:1"
    enum:
      - "1:1"
      - "16:9"
      - "4:3"
      - "3:2"
      - "3:4"
      - "2:3"
      - "9:16"
      - "5:4"
      - "4:5"
      - "21:9"
      - "1:4"
      - "4:1"
      - "1:8"
      - "8:1"
    description: Output aspect ratio.
examples:
  - title: Basic image
    request:
      model: gemini-3.1-flash-lite-image
      content:
        - type: text
          text: a vibrant infographic explaining photosynthesis with clear readable labels
      parameters:
        aspect_ratio: "16:9"
