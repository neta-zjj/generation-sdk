schema: neta.generation.model.v1
model: gemini-3.1-flash-image-preview
title: Gemini 3.1 Flash Image Preview
category: image
description: Excels at text rendering, UI components and icons, commercial visuals, and image editing. It handles both photorealistic and non-photorealistic styles reliably, producing clean, consistent images while preserving key features from references. Strong natural-language understanding and broad world knowledge help it follow complex prompts. Its images are generally less expressive than those from gpt-image-2, and its style-transfer capabilities are weaker. Moderate speed, but relatively expensive.
adapter:
  type: gemini.generateContent
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Prompt text.
    - type: image
      required: false
      max: 14
      sources:
        - url
      description: Optional reference images.
parameters:
  aspect_ratio:
    type: string
    optional: true
    default: "1:1"
    enum:
      - "1:1"
      - "16:9"
      - "4:3"
      - "3:2"
      - "3:4"
      - "2:3"
      - "9:16"
      - "5:4"
      - "4:5"
      - "21:9"
      - "1:4"
      - "4:1"
      - "1:8"
      - "8:1"
    description: Output aspect ratio.
  image_size:
    type: string
    optional: true
    default: 2K
    enum:
      - "512"
      - 1K
      - 2K
      - 4K
    description: Output image resolution.
examples:
  - title: Basic image
    request:
      model: gemini-3.1-flash-image-preview
      content:
        - type: text
          text: a vibrant infographic explaining photosynthesis with clear readable labels
      parameters:
        aspect_ratio: "16:9"
        image_size: 1K
