schema: neta.generation.model.v1
model: meshy-animation
title: Meshy Animation
category: 3d
description: Applies preset actions from the Meshy animation library, or a meshy-text-to-motion clip, to a character
  from meshy-rigging.
adapter:
  type: meshy.tasks
  operation: animation
content:
  input:
    - type: 3d
      required: true
      min: 1
      max: 2
      sources:
        - url
      roles:
        - motion
      description: A meshy-rigging output block, whose meta.task_id selects the rigging task, and optionally a
        meshy-text-to-motion output block with meta.role motion.
parameters:
  action_id:
    type: integer
    optional: true
    min: 0
    description: Preset action ID from the Meshy animation library.
  action_ids:
    type: array
    optional: true
    items:
      type: integer
      min: 0
    min: 1
    max: 10
    unique: true
    description: 1 to 10 preset action IDs, returned as one file with one clip per action in this order.
  post_process:
    type: string
    optional: true
    enum:
      - change_fps
      - fbx2usdz
      - extract_armature
    description: Post-processing applied to the animation output.
  fps:
    type: integer
    optional: true
    min: 24
    max: 60
    description: "Frame rate for post_process change_fps: 24, 25, 30, or 60. Meshy defaults to 30."
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 3600
    min: 60
    max: 7200
    description: Maximum seconds to wait for the task. Meshy recommends waiting at least 60 minutes.
examples:
  - title: Apply preset actions
    request:
      model: meshy-animation
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/rigged.glb
          meta:
            task_id: task_rigging_id
      parameters:
        action_ids:
          - 10
          - 25
          - 92
  - title: Apply a text-to-motion clip
    request:
      model: meshy-animation
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/rigged.glb
          meta:
            task_id: task_rigging_id
        - type: 3d
          source:
            type: url
            url: https://example.com/clip.fbx
          meta:
            task_id: task_motion_id
            role: motion
