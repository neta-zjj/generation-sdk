schema: neta.generation.model.v1
model: meshy
title: Meshy
category: 3d
description: Generates, textures, remeshes, rigs, and animates 3D models. parameters.operation selects the function.
adapter:
  type: meshy.tasks
content:
  input: []
parameters:
  operation:
    type: string
    enum:
      - text-to-3d
      - text-to-3d-refine
      - image-to-3d
      - multi-image-to-3d
      - retexture
      - remesh
      - rigging
      - text-to-motion
      - animation
    description: Function to run. operations declares the content inputs and parameters of each function.
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 3600
    min: 60
    max: 7200
    description: Maximum seconds to wait for the task. Meshy recommends waiting at least 60 minutes.
operations:
  text-to-3d:
    title: Text To 3D
    description: Generates an untextured 3D model from a text prompt. Pass the result to the text-to-3d-refine operation to
      texture it.
    content:
      input:
        - type: text
          required: true
          min: 1
          max: 16
          merge: newline
          description: Description of the object, up to 800 characters.
    parameters:
      model_type:
        type: string
        optional: true
        enum:
          - standard
          - smart-topology
        description: Mesh generation type. Meshy defaults to standard; smart-topology uses meshy-t2 and outputs triangles.
      ai_model:
        type: string
        optional: true
        enum:
          - latest
          - meshy-7.1
          - meshy-6
          - meshy-6-lite
          - meshy-t2
        description: Meshy model. Meshy defaults to latest (Meshy 7.1) for standard and to meshy-t2 for smart-topology.
      geometry_resolution:
        type: string
        optional: true
        enum:
          - standard
          - 2k
          - 4k
        description: Geometry pass. 2k and 4k run the Ultra pass and require meshy-7.1 or latest.
      should_remesh:
        type: boolean
        optional: true
        description: Run the remesh phase. Meshy defaults to false for Meshy 6 and Meshy 7 models and to true for others.
      topology:
        type: string
        optional: true
        enum:
          - quad
          - triangle
        description: Mesh topology. Meshy defaults to triangle.
      target_polycount:
        type: integer
        optional: true
        min: 100
        max: 300000
        description: "Target face count: 100 to 300,000 with should_remesh on a standard model, 100 to 15,000 with smart-topology."
      decimation_mode:
        type: integer
        optional: true
        min: 1
        max: 4
        description: Adaptive polycount level from 1 (ultra) to 4 (low). Overrides target_polycount.
      pose_mode:
        type: string
        optional: true
        enum:
          - a-pose
          - t-pose
        description: Generate the subject in an A pose or a T pose. No pose is applied when omitted.
      moderation:
        type: boolean
        optional: true
        description: Screen the inputs for harmful content before generation.
      target_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
            - glb
            - obj
            - fbx
            - stl
            - usdz
            - 3mf
        min: 1
        unique: true
        description: 3D file formats to generate. Meshy generates every format except 3mf when omitted.
      alpha_thumbnail:
        type: boolean
        optional: true
        description: Also render a transparent-background thumbnail.
      auto_size:
        type: boolean
        optional: true
        description: Estimate the real-world height of the object and resize the model to it.
      origin_at:
        type: string
        optional: true
        enum:
          - bottom
          - center
        description: Origin position when auto_size is enabled. Meshy defaults to bottom.
  text-to-3d-refine:
    title: Text To 3D Refine
    description: Textures a model from the text-to-3d operation. Texturing can be guided by a text prompt or by an image,
      but not both.
    content:
      input:
        - type: 3d
          required: true
          min: 1
          max: 1
          sources:
            - url
          description: A text-to-3d output block. Its meta.task_id selects the preview task.
        - type: text
          required: false
          max: 16
          merge: newline
          description: Texture prompt, up to 800 characters.
        - type: image
          required: false
          max: 1
          sources:
            - url
          description: Texture guide image (JPG, PNG, or WebP, up to 20 MB).
    parameters:
      enable_pbr:
        type: boolean
        optional: true
        description: Generate metallic, roughness, and normal maps in addition to the base color.
      texture_resolution:
        type: string
        optional: true
        enum:
          - 2k
          - 4k
          - 8k
        description: Base color texture resolution. Meshy defaults to 2k; 4k and 8k are not available with meshy-6-lite.
      ai_model:
        type: string
        optional: true
        enum:
          - latest
          - meshy-7.1
          - meshy-6
          - meshy-6-lite
        description: Texture model. Meshy defaults to the model of the preview task.
      remove_lighting:
        type: boolean
        optional: true
        description: Remove highlights and shadows from the base color texture. Takes effect with meshy-6.
      moderation:
        type: boolean
        optional: true
        description: Screen the inputs for harmful content before generation.
      target_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
            - glb
            - obj
            - fbx
            - stl
            - usdz
            - 3mf
        min: 1
        unique: true
        description: 3D file formats to generate. Meshy generates every format except 3mf when omitted.
      alpha_thumbnail:
        type: boolean
        optional: true
        description: Also render a transparent-background thumbnail.
      auto_size:
        type: boolean
        optional: true
        description: Estimate the real-world height of the object and resize the model to it.
      origin_at:
        type: string
        optional: true
        enum:
          - bottom
          - center
        description: Origin position when auto_size is enabled. Meshy defaults to bottom.
  image-to-3d:
    title: Image To 3D
    description: Generates a textured 3D model from one image.
    content:
      input:
        - type: image
          required: true
          min: 1
          max: 2
          sources:
            - url
          roles:
            - texture
          description: Input image (JPG, PNG, or WebP, up to 20 MB), and optionally a texture guide image with meta.role texture.
        - type: text
          required: false
          max: 16
          merge: newline
          description: Texture prompt, up to 800 characters. Use either this or a texture guide image.
    parameters:
      model_type:
        type: string
        optional: true
        enum:
          - standard
          - smart-topology
        description: Mesh generation type. Meshy defaults to standard; smart-topology uses meshy-t2 and outputs triangles.
      ai_model:
        type: string
        optional: true
        enum:
          - latest
          - meshy-7.1
          - meshy-6
          - meshy-6-lite
          - meshy-t2
        description: Meshy model. Meshy defaults to latest (Meshy 7.1) for standard and to meshy-t2 for smart-topology.
      geometry_resolution:
        type: string
        optional: true
        enum:
          - standard
          - 2k
          - 4k
        description: Geometry pass. 2k and 4k run the Ultra pass and require meshy-7.1 or latest.
      should_texture:
        type: boolean
        optional: true
        description: Generate textures. Set to false for an untextured mesh. Meshy defaults to true.
      enable_pbr:
        type: boolean
        optional: true
        description: Generate metallic, roughness, and normal maps in addition to the base color.
      texture_resolution:
        type: string
        optional: true
        enum:
          - 2k
          - 4k
          - 8k
        description: Base color texture resolution. Meshy defaults to 2k; 4k and 8k are not available with meshy-6-lite.
      should_remesh:
        type: boolean
        optional: true
        description: Run the remesh phase. Meshy defaults to false for Meshy 6 and Meshy 7 models and to true for others.
      topology:
        type: string
        optional: true
        enum:
          - quad
          - triangle
        description: Mesh topology. Meshy defaults to triangle.
      target_polycount:
        type: integer
        optional: true
        min: 100
        max: 300000
        description: "Target face count: 100 to 300,000 with should_remesh on a standard model, 100 to 15,000 with smart-topology."
      decimation_mode:
        type: integer
        optional: true
        min: 1
        max: 4
        description: Adaptive polycount level from 1 (ultra) to 4 (low). Overrides target_polycount.
      save_pre_remeshed_model:
        type: boolean
        optional: true
        description: Also return the GLB from before the remesh phase.
      image_enhancement:
        type: boolean
        optional: true
        description: Optimize the input images. Set to false to keep their exact appearance. Meshy defaults to true.
      remove_lighting:
        type: boolean
        optional: true
        description: Remove highlights and shadows from the base color texture. Meshy defaults to true.
      multi_view_thumbnails:
        type: boolean
        optional: true
        description: Also render front, right, back, and left thumbnails.
      pose_mode:
        type: string
        optional: true
        enum:
          - a-pose
          - t-pose
        description: Generate the subject in an A pose or a T pose. No pose is applied when omitted.
      moderation:
        type: boolean
        optional: true
        description: Screen the inputs for harmful content before generation.
      target_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
            - glb
            - obj
            - fbx
            - stl
            - usdz
            - 3mf
        min: 1
        unique: true
        description: 3D file formats to generate. Meshy generates every format except 3mf when omitted.
      alpha_thumbnail:
        type: boolean
        optional: true
        description: Also render a transparent-background thumbnail.
      auto_size:
        type: boolean
        optional: true
        description: Estimate the real-world height of the object and resize the model to it.
      origin_at:
        type: string
        optional: true
        enum:
          - bottom
          - center
        description: Origin position when auto_size is enabled. Meshy defaults to bottom.
  multi-image-to-3d:
    title: Multi-Image To 3D
    description: Generates a textured 3D model from 1 to 4 images of the same object taken from different angles.
    content:
      input:
        - type: image
          required: true
          min: 1
          max: 8
          sources:
            - url
          roles:
            - texture
          description: 1 to 4 views of the object, front view first, and optionally up to 4 texture guide images with meta.role
            texture.
        - type: text
          required: false
          max: 16
          merge: newline
          description: Texture prompt, up to 800 characters. Use either this or texture guide images.
    parameters:
      ai_model:
        type: string
        optional: true
        enum:
          - latest
          - meshy-7.1
          - meshy-6
          - meshy-6-lite
        description: Meshy model. Meshy defaults to latest (Meshy 7.1); more than one texture guide image requires meshy-7.1 or
          latest.
      geometry_resolution:
        type: string
        optional: true
        enum:
          - standard
          - 2k
        description: Geometry pass. 2k runs the Ultra pass and requires meshy-7.1 or latest.
      should_texture:
        type: boolean
        optional: true
        description: Generate textures. Set to false for an untextured mesh. Meshy defaults to true.
      enable_pbr:
        type: boolean
        optional: true
        description: Generate metallic, roughness, and normal maps in addition to the base color.
      texture_resolution:
        type: string
        optional: true
        enum:
          - 2k
          - 4k
          - 8k
        description: Base color texture resolution. Meshy defaults to 2k; 4k and 8k are not available with meshy-6-lite.
      should_remesh:
        type: boolean
        optional: true
        description: Run the remesh phase. Meshy defaults to false for Meshy 6 and Meshy 7 models and to true for others.
      topology:
        type: string
        optional: true
        enum:
          - quad
          - triangle
        description: Mesh topology. Meshy defaults to triangle.
      target_polycount:
        type: integer
        optional: true
        min: 100
        max: 300000
        description: Target face count with should_remesh, from 100 to 300,000. Meshy defaults to 30,000.
      decimation_mode:
        type: integer
        optional: true
        min: 1
        max: 4
        description: Adaptive polycount level from 1 (ultra) to 4 (low). Overrides target_polycount.
      save_pre_remeshed_model:
        type: boolean
        optional: true
        description: Also return the GLB from before the remesh phase.
      image_enhancement:
        type: boolean
        optional: true
        description: Optimize the input images. Set to false to keep their exact appearance. Meshy defaults to true.
      remove_lighting:
        type: boolean
        optional: true
        description: Remove highlights and shadows from the base color texture. Meshy defaults to true.
      multi_view_thumbnails:
        type: boolean
        optional: true
        description: Also render front, right, back, and left thumbnails.
      pose_mode:
        type: string
        optional: true
        enum:
          - a-pose
          - t-pose
        description: Generate the subject in an A pose or a T pose. No pose is applied when omitted.
      moderation:
        type: boolean
        optional: true
        description: Screen the inputs for harmful content before generation.
      target_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
            - glb
            - obj
            - fbx
            - stl
            - usdz
            - 3mf
        min: 1
        unique: true
        description: 3D file formats to generate. Meshy generates every format except 3mf when omitted.
      alpha_thumbnail:
        type: boolean
        optional: true
        description: Also render a transparent-background thumbnail.
      auto_size:
        type: boolean
        optional: true
        description: Estimate the real-world height of the object and resize the model to it.
      origin_at:
        type: string
        optional: true
        enum:
          - bottom
          - center
        description: Origin position when auto_size is enabled. Meshy defaults to bottom.
  retexture:
    title: Retexture
    description: Applies a new texture to a 3D model, guided by a style prompt or by style images.
    content:
      input:
        - type: 3d
          required: true
          min: 1
          max: 1
          sources:
            - url
          description: Model file (GLB, GLTF, OBJ, FBX, or STL, up to 100 MB). A block with meta.task_id from a Meshy task that
            this operation accepts references the task instead of the file.
        - type: text
          required: false
          max: 16
          merge: newline
          description: Style prompt, up to 800 characters. Use either this or style images.
        - type: image
          required: false
          max: 4
          sources:
            - url
          description: One style image, or 2 to 4 views of the object, front view first, which require ai_model meshy-7.
    parameters:
      ai_model:
        type: string
        optional: true
        enum:
          - latest
          - meshy-7
          - meshy-6
          - meshy-6-lite
        description: Meshy model. Meshy defaults to latest (Meshy 7).
      enable_original_uv:
        type: boolean
        optional: true
        description: Keep the existing UV layout of the model. Recommended for models that Meshy generated.
      enable_pbr:
        type: boolean
        optional: true
        description: Generate metallic, roughness, and normal maps in addition to the base color.
      texture_resolution:
        type: string
        optional: true
        enum:
          - 2k
          - 4k
          - 8k
        description: Base color texture resolution. Meshy defaults to 2k; 4k and 8k are not available with meshy-6-lite.
      remove_lighting:
        type: boolean
        optional: true
        description: Remove highlights and shadows from the base color texture. Takes effect with meshy-6 at 2k or 4k.
      target_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
            - glb
            - obj
            - fbx
            - stl
            - usdz
            - 3mf
        min: 1
        unique: true
        description: 3D file formats to generate. Meshy generates every format except 3mf when omitted.
      alpha_thumbnail:
        type: boolean
        optional: true
        description: Also render a transparent-background thumbnail.
  remesh:
    title: Remesh
    description: Rebuilds the mesh of a 3D model at a target topology and polycount, and converts it to other formats.
    content:
      input:
        - type: 3d
          required: true
          min: 1
          max: 1
          sources:
            - url
          description: Model file (GLB, GLTF, OBJ, FBX, or STL, up to 100 MB). A block with meta.task_id from a Meshy task that
            this operation accepts references the task instead of the file.
    parameters:
      target_formats:
        type: array
        optional: true
        items:
          type: string
          enum:
            - glb
            - fbx
            - obj
            - usdz
            - blend
            - stl
            - 3mf
        min: 1
        unique: true
        description: 3D file formats to generate. Meshy generates only GLB when omitted.
      topology:
        type: string
        optional: true
        enum:
          - quad
          - triangle
        description: Mesh topology. Meshy defaults to triangle.
      target_polycount:
        type: integer
        optional: true
        min: 100
        max: 300000
        description: Target face count, from 100 to 300,000. Meshy defaults to 30,000.
      decimation_mode:
        type: integer
        optional: true
        min: 1
        max: 4
        description: Adaptive polycount level from 1 (ultra) to 4 (low). Overrides target_polycount.
      alpha_thumbnail:
        type: boolean
        optional: true
        description: Also render a transparent-background thumbnail.
  rigging:
    title: Rigging
    description: Adds a skeleton to a textured humanoid model and returns the rigged character with walking and running animations.
    content:
      input:
        - type: 3d
          required: true
          min: 1
          max: 1
          sources:
            - url
          description: Textured humanoid GLB, up to 100 MB and 300,000 faces. A block with meta.task_id from a Meshy task
            references the task instead of the file.
        - type: image
          required: false
          max: 1
          sources:
            - url
          description: UV-unwrapped base color texture of the model (PNG, up to 20 MB).
    parameters:
      height_meters:
        type: number
        optional: true
        description: Approximate height of the character in meters; must be positive. Meshy defaults to 1.7.
  text-to-motion:
    title: Text To Motion
    description: Generates a motion clip from a text description. Apply it to a rigged character with the animation operation.
    content:
      input:
        - type: text
          required: true
          min: 1
          max: 16
          merge: newline
          description: Description of the motion, up to 400 characters.
    parameters:
      duration:
        type: number
        min: 2
        max: 10
        multipleOf: 0.5
        description: Clip duration in seconds, from 2 to 10 in steps of 0.5.
      mode:
        type: string
        optional: true
        enum:
          - prime
          - swift
        description: prime gives the highest quality and outputs FBX; swift is faster, costs less, and outputs BVH.
  animation:
    title: Animation
    description: Applies preset actions from the Meshy animation library, or a text-to-motion clip, to a character from the
      rigging operation.
    content:
      input:
        - type: 3d
          required: true
          min: 1
          max: 2
          sources:
            - url
          roles:
            - motion
          description: A rigging output block, whose meta.task_id selects the rigging task, and optionally a text-to-motion output
            block with meta.role motion.
    parameters:
      action_id:
        type: integer
        optional: true
        min: 0
        description: Preset action ID from the Meshy animation library.
      action_ids:
        type: array
        optional: true
        items:
          type: integer
          min: 0
        min: 1
        max: 10
        unique: true
        description: 1 to 10 preset action IDs, returned as one file with one clip per action in this order.
      post_process:
        type: string
        optional: true
        enum:
          - change_fps
          - fbx2usdz
          - extract_armature
        description: Post-processing applied to the animation output.
      fps:
        type: integer
        optional: true
        min: 24
        max: 60
        description: "Frame rate for post_process change_fps: 24, 25, 30, or 60. Meshy defaults to 30."
examples:
  - title: Text to 3D preview
    request:
      model: meshy
      content:
        - type: text
          text: a wooden treasure chest with iron bands
      parameters:
        operation: text-to-3d
        target_formats:
          - glb
          - usdz
  - title: Refine a preview
    request:
      model: meshy
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/preview.glb
          meta:
            task_id: task_preview_id
        - type: text
          text: weathered oak planks and dark iron
      parameters:
        operation: text-to-3d-refine
        enable_pbr: true
  - title: Image to 3D
    request:
      model: meshy
      content:
        - type: image
          source:
            type: url
            url: https://example.com/character.png
      parameters:
        operation: image-to-3d
        pose_mode: a-pose
        target_formats:
          - glb
  - title: Multi-image to 3D
    request:
      model: meshy
      content:
        - type: image
          source:
            type: url
            url: https://example.com/front.png
        - type: image
          source:
            type: url
            url: https://example.com/side.png
        - type: image
          source:
            type: url
            url: https://example.com/back.png
      parameters:
        operation: multi-image-to-3d
        target_formats:
          - glb
  - title: Retexture from a style prompt
    request:
      model: meshy
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/model.glb
        - type: text
          text: polished marble with gold trim
      parameters:
        operation: retexture
        enable_original_uv: true
  - title: Remesh to quads
    request:
      model: meshy
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/model.glb
      parameters:
        operation: remesh
        topology: quad
        target_polycount: 10000
        target_formats:
          - glb
          - fbx
  - title: Rig a character
    request:
      model: meshy
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/character.glb
      parameters:
        operation: rigging
        height_meters: 1.8
  - title: Text to motion
    request:
      model: meshy
      content:
        - type: text
          text: a person jumps forward and lands softly
      parameters:
        operation: text-to-motion
        duration: 3
        mode: prime
  - title: Apply preset actions
    request:
      model: meshy
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/rigged.glb
          meta:
            task_id: task_rigging_id
      parameters:
        operation: animation
        action_ids:
          - 10
          - 25
          - 92
  - title: Apply a text-to-motion clip
    request:
      model: meshy
      content:
        - type: 3d
          source:
            type: url
            url: https://example.com/rigged.glb
          meta:
            task_id: task_rigging_id
        - type: 3d
          source:
            type: url
            url: https://example.com/clip.fbx
          meta:
            task_id: task_motion_id
            role: motion
      parameters:
        operation: animation
