schema: neta.generation.model.v1
model: noobxl-t2i-onediff
title: NoobXL T2I OneDiff
description: Anime-specialized NoobXL text-to-image model for anime-style illustrations. It works best with English Danbooru tags, which can invoke specific anime characters and illustrator styles. Natural-language understanding is limited. Fast and extremely low cost.
allowUnknownParameters: true
adapter:
  type: openai.images
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Prompt text.
parameters:
  size:
    type: string
    optional: true
    default: 1024x1024
    enum:
      - 1024x1024
      - 896x1152
      - 1152x896
      - 1344x768
      - 768x1344
    description: Output image size.
  negative_prompt:
    type: string
    optional: true
    description: Content to avoid in generated images.
  seed:
    type: integer
    optional: true
    min: 0
    description: Random seed for reproducibility.
examples:
  - title: Text to image
    request:
      model: noobxl-t2i-onediff
      content:
        - type: text
          text: anime key visual, luminous city at night, crisp linework
      parameters:
        size: 1024x1024
        negative_prompt: low quality, blurry
