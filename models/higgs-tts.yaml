schema: neta.generation.model.v1
model: higgs-tts
title: Higgs TTS
description: Reference-focused text-to-speech with stronger reference-voice fidelity than the Qwen models. Choose Higgs for its default voice, high-fidelity single-reference cloning, or blending 2-16 weighted references. It cannot create a voice from a text-only description; use a Qwen model with meta.voice_prompt for that mode. Generates exactly one HTTP(S) URL audio block.
adapter:
  type: openai.audioSpeech
content:
  input:
    - type: text
      required: true
      min: 1
      max: 1
      description: Exactly one non-empty text block to speak.
    - type: audio
      required: false
      max: 16
      sources:
        - url
      description: Optional HTTP(S) URL voice reference. A single reference may omit meta.weight; with 2-16 references, every audio block requires a finite positive meta.weight.
examples:
  - title: Default voice
    request:
      model: higgs-tts
      content:
        - type: text
          text: 使用默认音色朗读这段文本。
  - title: Single reference
    request:
      model: higgs-tts
      content:
        - type: text
          text: 使用单条参考音频朗读这段文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
  - title: Weighted single reference
    request:
      model: higgs-tts
      content:
        - type: text
          text: 使用带权重的单条参考音频朗读这段文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference.mp3
          meta:
            weight: 1
  - title: Multiple references
    request:
      model: higgs-tts
      content:
        - type: text
          text: 使用多参考融合音色朗读这段文本。
        - type: audio
          source:
            type: url
            url: https://example.com/reference-a.mp3
          meta:
            weight: 0.5
        - type: audio
          source:
            type: url
            url: https://example.com/reference-b.mp3
          meta:
            weight: 0.5
