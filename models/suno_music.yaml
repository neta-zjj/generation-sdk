schema: neta.generation.model.v1
model: suno_music
title: Suno Music
description: Suno music model for songs, lyrics, sound effects, and integrated music tasks.
adapter:
  type: suno.tasks
content:
  input:
    - type: text
      required: false
      max: 16
      merge: newline
      description: Optional prompt text. The adapter maps merged text to the operation's text field when that field is not provided.
    - type: audio
      required: false
      max: 1
      sources:
        - url
        - base64
      description: Optional reference audio. The adapter maps it to url when url is not provided.
    - type: image
      required: false
      max: 1
      sources:
        - url
        - base64
      description: Optional image source. The adapter maps it to image_url when image_url is not provided.
    - type: video
      required: false
      max: 1
      sources:
        - url
        - base64
      description: Optional video source. The adapter maps it to video_url when video_url is not provided.
parameters:
  operation:
    type: string
    optional: true
    default: music
    enum:
      - music
      - lyrics
      - concat
      - upsample_tags
      - upload_audio
    description: Suno endpoint operation. Provider-specific fields such as task, mv, title, tags, original_tags, metadataParams, and clip_id belong in request meta.
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 600
    min: 30
    max: 3600
    description: Maximum seconds to wait for task completion.
meta:
  taskField: task
  fields:
    task:
      type: string
      optional: true
      enum:
        - extend
        - upload_extend
        - infill
        - fixed_infill
        - infill_intro
        - infill_outro
        - cover_infill
        - cover_extend
        - artist_infill
        - artist_consistency
        - cover
        - image_to_song
        - video_to_song
        - concat
        - sound
        - underpainting
        - remaster
        - vox
        - mashup_condition
      description: Integrated Suno music task for operation=music.
    mv:
      type: string
      optional: true
      description: Suno music model version.
    task_id:
      type: string
      optional: true
      description: Existing Suno task id used for continuation-style tasks.
    clip_id:
      type: string
      optional: true
      description: Existing Suno clip id used for continuation-style tasks.
    continue_clip_id:
      type: string
      optional: true
      description: Clip id to continue from.
    continue_at:
      type: number
      optional: true
      description: Continue position in seconds.
    model_name:
      type: string
      optional: true
      description: Suno model name used by remaster.
    variation_category:
      type: string
      optional: true
      description: Remaster variation category.
    metadata_params:
      type: object
      optional: true
      description: Yunwu/Suno task-specific metadata payload.
  taskVariants:
    extend:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    upload_extend:
      required:
        - clip_id
        - continue_clip_id
    infill:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    fixed_infill:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    infill_intro:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    infill_outro:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    cover_infill:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    cover_extend:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    artist_infill:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    artist_consistency:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    cover:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    image_to_song:
      requiredContent:
        - image
      required:
        - metadata_params
    video_to_song:
      requiredContent:
        - video
      required:
        - metadata_params
    concat:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    sound:
      required:
        - metadata_params
    underpainting:
      required:
        - metadata_params
    remaster:
      sendTask: false
      required:
        - clip_id
        - model_name
        - variation_category
    vox:
      required:
        - task_id
        - clip_id
        - continue_clip_id
    mashup_condition:
      required:
        - task_id
        - clip_id
        - continue_clip_id
examples:
  - title: Music generation
    request:
      model: suno_music
      content:
        - type: text
          text: uplifting cinematic pop with warm piano and clear chorus
      parameters:
        operation: music
      meta:
        mv: chirp-v5-5
        title: Warm Horizon
        tags: cinematic pop, warm piano
        make_instrumental: false
  - title: Lyrics
    request:
      model: suno_music
      content:
        - type: text
          text: write a hopeful chorus about sunrise after a storm
      parameters:
        operation: lyrics
  - title: Sound effect
    request:
      model: suno_music
      content:
        - type: text
          text: ambient music with gentle rain and distant thunder
      parameters:
        operation: music
      meta:
        task: sound
        mv: chirp-v5-5
        metadata_params:
          sound: gentle rain ambience with distant thunder
        title: Gentle Rain
        tags: ambient, rain, cinematic
        make_instrumental: true
  - title: Image to song
    request:
      model: suno_music
      content:
        - type: text
          text: turn this image into a short hopeful pop song
        - type: image
          source:
            type: url
            url: https://picsum.photos/512/512
      parameters:
        operation: music
      meta:
        task: image_to_song
        mv: chirp-v5-5
        metadata_params:
          image_url: https://picsum.photos/512/512
          prompt: turn this image into a short hopeful pop song
