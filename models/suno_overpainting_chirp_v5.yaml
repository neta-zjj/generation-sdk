schema: neta.generation.model.v1
model: suno_overpainting_chirp_v5
title: Suno Overpainting Chirp v5.0
description: Suno add-vocal task with a fixed chirp-v5 engine.
adapter:
  type: suno.tasks
  operation: music
  task: overpainting
  payload:
    mv: chirp-v5
content:
  input:
    - type: text
      required: false
      max: 16
      merge: newline
      description: Prompt text. The adapter maps merged text to the operation's text field when that field is not provided.
parameters:
  poll_interval:
    type: integer
    optional: true
    default: 5
    min: 1
    max: 60
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 600
    min: 30
    max: 3600
    description: Maximum seconds to wait for task completion.
meta:
  fields:
    title:
      type: string
      optional: true
      description: Suno song title.
    tags:
      type: string
      optional: true
      description: Comma-separated Suno music style tags.
    prompt:
      type: string
      optional: true
      description: Provider prompt override.
    gpt_description_prompt:
      type: string
      optional: true
      description: Suno inspiration-mode prompt.
    negative_tags:
      type: string
      optional: true
      description: Styles to avoid.
    generation_type:
      type: string
      optional: true
      description: Suno generation type.
    make_instrumental:
      type: boolean
      optional: true
      default: false
      description: Generate instrumental music.
    metadata:
      type: object
      optional: true
      description: Suno provider metadata payload.
    metadata_params:
      type: object
      description: Overpainting clip and timing metadata.
  taskVariants:
    extend:
      required:
        - continue_clip_id
    upload_extend:
      required:
        - continue_clip_id
    infill:
      required:
        - continue_clip_id
        - metadata_params
    fixed_infill:
      required:
        - continue_clip_id
        - metadata_params
    infill_intro:
      required:
        - continue_clip_id
        - metadata_params
    infill_outro:
      required:
        - continue_clip_id
        - metadata_params
    cover_infill:
      required:
        - continue_clip_id
        - metadata_params
    cover_extend:
      required:
        - continue_clip_id
    artist_infill:
      required:
        - continue_clip_id
        - metadata_params
    artist_consistency:
      required:
        - persona_id
        - artist_clip_id
    cover: {}
    image_to_song:
      requiredContent:
        - image
      required:
        - metadata_params
    video_to_song:
      requiredContent:
        - video
      required:
        - metadata_params
    concat:
      required:
        - clip_id
    sound:
      required:
        - metadata_params
    underpainting:
      required:
        - metadata_params
    overpainting:
      required:
        - metadata_params
    remaster:
      required:
        - metadata_params
    vox:
      required:
        - metadata_params
    chop_sample_condition:
      required:
        - metadata_params
    mashup_condition:
      required:
        - metadata_params
    playlist_condition:
      required:
        - metadata_params
